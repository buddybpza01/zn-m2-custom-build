name: Build ZN-M2 LibWrt

on:
  workflow_dispatch:
    inputs:
      MODE:
        description: 'check=只验证配置不编译 / full=完整编译'
        default: 'check'
        required: true
        type: choice
        options:
          - check
          - full
      ONLY:
        description: '只跑某个变体(留空=全部)'
        default: ''
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'MODE_TRIGGER'
permissions: write-all

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - name: libwrt
            repo: https://github.com/LiBwrt/LibWrt.git
            branch: 25.12-nss
            cfg: zn_m2.config
            patchram: 0
          - name: libwrt-ram
            repo: https://github.com/LiBwrt/LibWrt.git
            branch: 25.12-nss
            cfg: zn_m2.config
            patchram: 1
          - name: lienol
            repo: https://github.com/Lienol/openwrt.git
            branch: 25.12
            cfg: zn_m2.config
            patchram: 0
          - name: lienol-ram
            repo: https://github.com/Lienol/openwrt.git
            branch: 25.12
            cfg: zn_m2.config
            patchram: 1
          - name: laipeng
            repo: https://github.com/laipeng668/openwrt-6.x.git
            branch: 25.12-nss
            cfg: zn_m2.config
            patchram: 0
          - name: minimal
            repo: https://github.com/LiBwrt/LibWrt.git
            branch: 25.12-nss
            cfg: zn_m2-min.config
            patchram: 1

    steps:
      - run: echo ok
