name: Build ZN-M2 Custom

on:
  workflow_dispatch:
    inputs:
      TEST:
        description: '仅输出配置不编译'
        default: 'false'
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: IPQ60XX-CUSTOM
    strategy:
      fail-fast: false
      matrix:
        CONFIG: [IPQ60XX-CUSTOM]
        SOURCE: [VIKINGYFY/immortalwrt]
        BRANCH: [main]

    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: ${{matrix.CONFIG}}
      WRT_THEME: argon
      WRT_NAME: ZNM2
      WRT_SSID: ZNM2
      WRT_WORD: 12345678
      WRT_IP: 192.168.1.1
      WRT_PW: 无
      WRT_REPO: https://github.com/${{matrix.SOURCE}}.git
      WRT_BRANCH: ${{matrix.BRANCH}}
      WRT_SOURCE: ${{matrix.SOURCE}}
      WRT_PACKAGE: ''
      WRT_TEST: ${{inputs.TEST || 'false'}}
