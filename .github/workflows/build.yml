name: Build ZN-M2 LibWrt

on:
  workflow_dispatch:
    inputs:
      MODE:
        description: 'check=只验证配置不编译 / full=完整编译'
        default: 'check'
        required: true
        type: choice
        options:
          - check
          - full
      ONLY:
        description: '只跑某个变体(留空=全部)'
        default: ''
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'MODE_TRIGGER'
permissions: write-all

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          # 主线：Lienol（上一轮完整产出固件）
          - name: minimal
            repo: https://github.com/Lienol/openwrt.git
            branch: 25.12
            cfg: zn_m2.config
            patchram: 1
          # 对照：LibWrt（wpad 已全部排除，避免旧 hostapd 变体）
          - name: minimal-libwrt
            repo: https://github.com/LiBwrt/LibWrt.git
            branch: 25.12-nss
            cfg: zn_m2.config
            patchram: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show runner
        run: |
          echo "runner=$RUNNER_NAME cores=$(nproc) mode=${{ inputs.MODE }} variant=${{ matrix.name }}"
          nproc; df -h /
          echo "--- workspace 内容 ---"
          ls -la $GITHUB_WORKSPACE
          ls -la $GITHUB_WORKSPACE/Config || echo "!!! Config 目录不存在 !!!"

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Init
        run: |
          echo "BUILD_DATE=$(TZ=UTC-8 date +'%y.%m.%d-%H.%M')" >> $GITHUB_ENV

      - name: Install deps
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -yqq update
          sudo -E apt-get -yqq install build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget \
            dos2unix python3-netifaces libfuse-dev ccache time
          sudo timedatectl set-timezone "Asia/Shanghai"

      - name: Prepare build dir
        run: |
          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          ln -sfn /mnt/build_wrt ./wrt

      - name: Clone source
        run: |
          git clone --depth=1 --single-branch --branch "${{ matrix.branch }}" "${{ matrix.repo }}" ./wrt/code
          cd ./wrt/code
          echo "SRC_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV
          echo "内核声明: $(grep -oP 'KERNEL_PATCHVER:=\K[\d\.]+' target/linux/qualcommax/Makefile || echo 未知)"
          echo "zn_m2 设备定义数: $(grep -c 'Device/zn_m2' target/linux/qualcommax/image/ipq60xx.mk || echo 0)"

      - name: Update feeds
        run: |
          cd ./wrt/code
          ./scripts/feeds update -a 2>&1 | tail -20
          ./scripts/feeds install -a 2>&1 | tail -20

      - name: Add OpenClash
        run: |
          cd ./wrt/code
          git clone --depth=1 --branch dev https://github.com/vernesong/OpenClash.git /tmp/oc
          cp -r /tmp/oc/luci-app-openclash ./package/luci-app-openclash
          echo "--- Makefile 头部 ---"
          head -20 ./package/luci-app-openclash/Makefile
          echo "--- 目录 ---"
          ls ./package/luci-app-openclash

      - name: RAM patch
        if: matrix.patchram == '1'
        run: |
          cd ./wrt/code
          # 脚本按“该源码树真实存在的 DTS 文件名与 label/节点路径”自动选择写法，
          # 选不到就 exit 1，不制造“补丁没生效但日志看起来成功”的情况。
          python3 $GITHUB_WORKSPACE/Scripts/patch-ram.py

      - name: Verify DTS source patch
        if: matrix.patchram == '1'
        run: |
          cd ./wrt/code
          D=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom
          echo "=== q6_region ==="
          grep -n 'reg = <0x0 0x4ab00000' "$D/ipq6018-512m.dtsi"
          grep -q '0x2000000' "$D/ipq6018-512m.dtsi" || { echo "!!! q6_region 未改成功"; exit 1; }
          echo "=== M2 DTS 里的禁用块 ==="
          FOUND=0
          for f in "$D/ipq6000-m2.dts" "$D/ipq6000-zn-m2.dts"; do
            if [ -f "$f" ] && grep -q 'ipq_m2_disable_wifi' "$f"; then
              echo "OK: $f"
              tail -10 "$f"
              FOUND=1
            fi
          done
          [ "$FOUND" = "1" ] || { echo "!!! 没有在任何 M2 DTS 里找到禁用块"; exit 1; }
          echo "DTS source patch verified"

      - name: Patch defaults
        run: |
          cd ./wrt/code
          C=./package/base-files/files/bin/config_generate
          sed -i "s/192\.168\.[0-9]*\.[0-9]*/192.168.1.2/g" $C
          sed -i "s/hostname='.*'/hostname='ZNM2'/g" $C

      - name: Boot args untouched (deliberate)
        run: |
          cd ./wrt/code
          D=target/linux/qualcommax/files/arch/arm64/boot/dts/qcom
          # 故意不注入任何 bootargs。
          # 理由：zn_m2 的 chosen/bootargs-append 由父 DTSI 提供（root=/dev/ubiblock0_1），
          # 这是 QCA U-Boot 的约定；再写 chosen/bootargs 可能整体替换掉内核命令行，
          # 反而丢掉 root= 和 console。上一轮已证明带 root= 的镜像仍然起不来，
          # 所以 bootargs 不是当前瓶颈，保持原样最安全。
          echo "=== 保持 bootargs 原样，仅打印现有值 ==="
          grep -rn "bootargs-append" "$D" 2>/dev/null | grep -E "ipq6000-(m2|zn-m2|cmiot)" || true
          echo "=== 确认没有额外注入 ==="
          for f in "$D/ipq6000-m2.dts" "$D/ipq6000-zn-m2.dts"; do
            if [ -f "$f" ]; then
              if grep -qE 'chosen\s*\{|bootargs' "$f"; then
                echo "!!! $f 被改过，含 chosen/bootargs —— 会覆盖父 DTSI 的 root= !!!"
                grep -nE 'chosen\s*\{|bootargs' "$f"
                exit 1
              else
                echo "OK  $f 未注入 bootargs"
              fi
            fi
          done

      - name: Write .config and RESOLVE
        run: |
          cd ./wrt/code
          cp $GITHUB_WORKSPACE/Config/${{ matrix.cfg }} .config

          # RAM 变体：在 defconfig 之前追加关 WiFi 配置
          # 注意：不能用 heredoc！YAML 块标量会强制缩进，写进 .config 会带前导空格导致配置无效。
          # 用 printf 逐行追加，保证行首没有空格。
          if [ "${{ matrix.patchram }}" = "1" ]; then
            for K in ath11k-firmware-ipq6018 kmod-ath11k kmod-ath11k-ahb kmod-ath11k-pci wpad-openssl wpad-basic-mbedtls hostapd-common wireless-regdb; do
              printf 'CONFIG_PACKAGE_%s=n\n' "$K" >> .config
            done
            echo "已追加 wifi 关闭配置"
            tail -8 .config
          fi

          echo "=========== 输入 .config ==========="
          cat .config
          echo "=========== 开始 make defconfig ==========="
          make defconfig 2>&1 | tail -60
          echo "=========================================="
          echo "=========== 生效的目标 ==========="
          grep -E '^CONFIG_TARGET' .config
          echo "=========== 关键包是否生效 ==========="
          for K in luci-app-openclash kmod-tun dnsmasq-full ip-full iptables-nft kmod-nft-tproxy ca-bundle ca-certificates luci-compat kmod-ath11k ath11k-firmware-ipq6018; do
            V=$(grep -E "^CONFIG_PACKAGE_${K}=" .config || echo "缺失")
            echo "  $K -> $V"
          done

      - name: Sanity check
        run: |
          cd ./wrt/code
          FAIL=0
          grep -q 'CONFIG_TARGET_qualcommax_ipq60xx_DEVICE_zn_m2=y' .config || { echo "!!! zn_m2 未选中 !!!"; FAIL=1; }
          grep -q 'CONFIG_TARGET_PROFILE="DEVICE_zn_m2"' .config || { echo "!!! TARGET_PROFILE 错误 !!!"; FAIL=1; }

          echo "===== rust 依赖检查 ====="
          echo "--- 1) rust 包本身 ---"
          if grep -qE '^CONFIG_PACKAGE_rust=y' .config; then
            echo "!!! rust 被启用 → 必然编译失败 !!!"; FAIL=1
          else
            echo "  OK  rust 未启用"
          fi

          echo "--- 2) passwall 主包 ---"
          PW_ON=0
          for K in luci-app-passwall luci-app-passwall2; do
            if grep -qE "^CONFIG_PACKAGE_${K}=y" .config; then
              echo "  !!! ${K} 被启用"; PW_ON=1; FAIL=1
            else
              echo "  OK  ${K} 未启用"
            fi
          done

          echo "--- 3) passwall INCLUDE 子项 ---"
          INC=$(grep -E '^CONFIG_PACKAGE_luci-app-passwall_INCLUDE_.*=y' .config || true)
          if [ -n "$INC" ]; then
            echo "$INC" | sed 's/^/     /'
            if [ "$PW_ON" = "1" ]; then
              echo "  !!! passwall 主包已启用且 INCLUDE 残留 → rust 会被拉起"; FAIL=1
            else
              echo "  (警告) 有 INCLUDE 残留，但 passwall 主包未启用，rust 不会被编译 —— 不阻断"
            fi
          else
            echo "  OK  passwall INCLUDE 子项全关"
          fi

          echo "--- 4) 其它 rust 系包 ---"
          OTH=$(grep -E '^CONFIG_PACKAGE_(shadowsocks-rust|sing-box|jool|openvswitch|rustdesk)' .config | grep '=y' || true)
          if [ -n "$OTH" ]; then
            echo "$OTH" | sed 's/^/     /'
            echo "  (警告) 这些包会拉 rust，若编译失败请改配置"
          else
            echo "  OK  无 rust 系包启用"
          fi

          echo "--- 5) ★ RUBY_ENABLE_YJIT 必须关闭（真凶）★ ---"
          # ruby 的 PKG_BUILD_DEPENDS:=ruby/host RUBY_ENABLE_YJIT:rust/host
          # 而 Config.in 里 default y if x86_64||aarch64，我们是 aarch64
          # 结果 rust/host 去下载 LLVM 失败 → 整个编译崩
          YJIT=$(grep -E '^CONFIG_RUBY_ENABLE_YJIT=y' .config || true)
          if [ -n "$YJIT" ]; then
            echo "  !!! CONFIG_RUBY_ENABLE_YJIT=y → 会编译 rust/host → 必然失败 !!!"
            echo "  分析：luci-app-openclash DEPENDS 含 +ruby，ruby 在 aarch64 上默认开 YJIT"
            FAIL=1
          else
            echo "  OK  RUBY_ENABLE_YJIT 未启用"
          fi

          echo "--- 6) ruby 是否被装（openclash 需要它）---"
          if grep -qE '^CONFIG_PACKAGE_ruby=y' .config; then
            echo "  OK  ruby 已启用（openclash 依赖）"
          else
            echo "  (提示) ruby 未启用，openclash 的 LuCI 界面可能残缺"
          fi

          if [ "$FAIL" = "1" ]; then
            echo "===== 所有 TARGET 项 ====="
            grep -E '^CONFIG_TARGET' .config
            echo "===== ruby/rust 相关配置 ====="
            grep -E 'RUBY|RUST|rust' .config || true
            exit 1
          fi
          echo "PASS: 目标是 zn_m2，rust 已排除，YJIT 已关"

      - name: CHECK MODE summary
        if: inputs.MODE != 'full'
        run: |
          cd ./wrt/code
          # 注意：workflow 的 shell 带 -e，grep 无匹配返回 1 会中断脚本，
          # 所有 grep 必须加 || true
          echo "############ CHECK: ${{ matrix.name }} ############"
          echo "内核: $(grep -oP 'KERNEL_PATCHVER:=\K[\d\.]+' target/linux/qualcommax/Makefile || echo '?')"
          echo "----- 目标 ----"
          grep -E '^CONFIG_TARGET_(qualcommax=y|qualcommax_ipq60xx=y|PROFILE|BOARD|SUBTARGET)' .config || true

          echo "----- ① WiFi 是否彻底砍掉 ----"
          for K in kmod-ath11k kmod-ath11k-ahb kmod-ath11k-pci ath11k-firmware-ipq6018 wpad-openssl wpad-basic-mbedtls hostapd-common wireless-regdb kmod-mac80211 kmod-cfg80211; do
            if grep -qE "^CONFIG_PACKAGE_${K}=y$" .config 2>/dev/null; then
              echo "  !!! 仍在: $K"
            else
              echo "  OK  $K 已砍"
            fi
          done

          echo "----- ② USB/FS 是否砍掉 ----"
          for K in kmod-usb3 kmod-usb-core kmod-usb-dwc3 kmod-usb-xhci-hcd kmod-fs-ext4 kmod-fs-f2fs e2fsprogs f2fs-tools; do
            if grep -qE "^CONFIG_PACKAGE_${K}=y$" .config 2>/dev/null; then
              echo "  !!! 仍在: $K"
            else
              echo "  OK  $K 已砍"
            fi
          done

          echo "----- ③ NSS 是否完整保留 ----"
          for K in kmod-qca-nss-drv kmod-qca-nss-ecm kmod-qca-nss-dp kmod-nss-ifb kmod-qca-nss-crypto nss-firmware-ipq60xx kmod-qca-nss-drv-bridge-mgr kmod-qca-nss-drv-vlan-mgr; do
            if grep -qE "^CONFIG_PACKAGE_${K}=y$" .config 2>/dev/null; then
              echo "  OK  $K"
            else
              echo "  !!! 缺失: $K"
            fi
          done

          echo "----- ④ OpenClash 依赖是否齐 ----"
          for K in luci-app-openclash kmod-tun dnsmasq-full ip-full iptables-nft kmod-nft-tproxy kmod-nft-core kmod-nft-nat kmod-inet-diag kmod-nf-conntrack-netlink ca-bundle ca-certificates curl luci-mod-network uhttpd; do
            if grep -qE "^CONFIG_PACKAGE_${K}=y$" .config 2>/dev/null; then
              echo "  OK  $K"
            else
              echo "  !!! 缺失: $K"
            fi
          done

          echo "----- ⑤ 核心组件必须在（删了系统起不来）-----"
          for K in base-files busyless procd netifd fstools busybox uci ubus; do
            if grep -qE "^CONFIG_PACKAGE_${K}=y$" .config 2>/dev/null; then
              echo "  OK  $K"
            fi
          done

          echo "----- ⑥ 最终包清单 -----"
          grep -E '^CONFIG_PACKAGE_[a-zA-Z0-9_.-]+=y$' .config \
            | sed 's/^CONFIG_PACKAGE_//; s/=y$//' | sort > /tmp/pkgs.txt || true
          echo "全部 CONFIG_PACKAGE_*=y 数量: $(wc -l < /tmp/pkgs.txt)"
          echo ""
          echo ">>> 按字母序的完整清单 <<<"
          cat /tmp/pkgs.txt
          echo "####################################################"

      - name: Download pkgs
        if: inputs.MODE == 'full'
        run: |
          cd ./wrt/code
          make download -j$(nproc) 2>&1 | tail -20
          echo "download done"

      - name: Compile
        if: inputs.MODE == 'full'
        run: |
          cd ./wrt/code
          set -o pipefail
          # 注意：必须 pipefail，否则 tail 的退出码会掩盖 make 的失败
          make -j$(nproc) 2>&1 | tail -400
          echo "===== make 退出码: $? ====="

      - name: Retry verbose on failure
        if: failure() && inputs.MODE == 'full'
        run: |
          cd ./wrt/code
          set -o pipefail
          echo "===== 首次失败，V=s 重试定位 ====="
          make -j1 V=s 2>&1 | tail -600

      - name: Report
        if: inputs.MODE == 'full'
        run: |
          cd ./wrt/code
          echo "==== 产物 ===="
          find ./bin/targets/ -type f \( -name "*.ubi" -o -name "*.bin" -o -name "*.itb" \) -printf "%10s  %f\n" 2>/dev/null || echo "(无)"
          echo "==== 内核 ===="
          find ./bin/targets/ -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; 2>/dev/null || echo "(无)"
          KVER=$(find ./bin/targets/ -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; 2>/dev/null | head -1)
          echo "KVER=$KVER" >> $GITHUB_ENV
          echo "==== 关键包 ===="
          find ./bin/targets/ -name "*.manifest" -exec grep -E 'luci-app-openclash|kmod-tun|^kernel' {} \; 2>/dev/null || true

      - name: Collect
        if: inputs.MODE == 'full'
        run: |
          cd ./wrt/code
          mkdir -p ./upload
          find ./bin/targets/ -type f \( -name "*zn_m2*" -o -name "*.manifest" \) -exec cp -f {} ./upload/ \; 2>/dev/null || true
          cp -f .config ./upload/config.txt 2>/dev/null || true
          ls -la ./upload/

      - name: Upload artifact
        if: inputs.MODE == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-${{ env.BUILD_DATE }}
          path: ./wrt/code/upload/
          retention-days: 30

      - name: Release
        if: inputs.MODE == 'full' && env.KVER != ''
        uses: softprops/action-gh-release@master
        with:
          tag_name: ${{ matrix.name }}-${{ env.BUILD_DATE }}
          files: ./wrt/code/upload/*
          body: |
            兆能 ZN-M2 变体 ${{ matrix.name }}
            源码 ${{ matrix.repo }} @ ${{ matrix.branch }} (${{ env.SRC_HASH }})
            内核 ${{ env.KVER }}
            LAN 192.168.1.2
